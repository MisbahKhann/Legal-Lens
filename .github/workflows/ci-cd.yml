name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck-frontend:
    name: Frontend Quality Check (Next.js/React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Frontend exists
        id: check_frontend
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend package.json not found, skipping frontend checks."
          fi

      - name: Setup Node.js
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript Check
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run typecheck || npx tsc --noEmit

      - name: Verify Production Build
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run build

  test-backend:
    name: Backend Quality Check (FastAPI/Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 black mypy

      - name: Code Formatting Check (Black & Flake8)
        run: |
          black --check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest --maxfail=1 --disable-warnings -q