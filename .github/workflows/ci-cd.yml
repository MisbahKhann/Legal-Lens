name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── CI: BACKEND ──────────────────────────────────────────────────────────────
  backend:
    name: CI - Backend Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Formatting check (Black)
        working-directory: ./backend
        run: black --check .

      - name: Lint (Flake8, critical errors only)
        working-directory: ./backend
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__

      - name: Run tests
        working-directory: ./backend
        run: >
          pytest -q --disable-warnings
          tests/test_schema_validation.py
          tests/test_deterministic_extraction.py
          tests/test_extraction_evaluation.py

  # ── CI: FRONTEND (skipped until a real app exists) ───────────────────────────
  frontend:
    name: CI - Frontend Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend is initialized
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet - skipping frontend checks."
          fi

      - name: Setup Node.js
        if: steps.check.outputs.initialized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.check.outputs.initialized == 'true'
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: steps.check.outputs.initialized == 'true'
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build
        if: steps.check.outputs.initialized == 'true'
        working-directory: ./frontend
        run: npm run build --if-present

  # ── CD: only after both CI jobs pass, only on main ───────────────────────────
  deploy:
    name: CD - Package Release
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package backend release
        run: |
          mkdir -p release
          tar --exclude='backend/.venv' --exclude='backend/storage' \
              --exclude='__pycache__' --exclude='.pytest_cache' \
              -czf release/legallens-backend.tar.gz backend

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: legallens-backend-release
          path: release/legallens-backend.tar.gz

      - name: Done
        run: echo "CI passed - release artifact built."